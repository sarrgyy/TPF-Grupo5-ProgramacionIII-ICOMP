<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Seguimiento Logístico</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="container">
        <header>
            <h1>Sistema de Seguimiento de Logística y Distribución</h1>
        </header>

        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="gestion.html">Gestion</a></li>
                <li><a href="cargas.html" class="activo">Cargar</a></li>
                <li><a href="seguimiento.html">Seguimiento</a></li>
            </ul>
        </nav>

        <div class="main-wrapper">
            <section id="content">
                <div class="card">
                    <h2>Cargar Producto</h2>
                    <form id="carga-form">
                        <div class="form-row">
                            <div class="form-group">
                                <label for="origen">Origen</label>
                                <select name="origen" id="origen">
                                    <option value="centro">Depósito Centro</option>
                                    <option value="melipal">Depósito Melipal</option>
                                    <option value="dina-huapi">Depósito Dina Huapi</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="destino">Destino</label>
                                <input type="text" id="destino" placeholder="Ej. Invap / Garibaldi 170">
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">X
                                <div class="form-group">
                                    <label for="vehiculo">Vehículo Asignado</label>
                                    <select name="vehiculo" id="vehiculo">
                                        <option value="kangoo">Kangoo</option>
                                        <option value="amarok">Amarok</option>
                                        <option value="camion">Camión</option>
                                        <option value="moto">Moto</option>
                                    </select>
                            </div>
                            <div class="form-group">
                                <label for="chofer">Chofer</label>
                                    <input type="text" id="chofer" placeholder="Nombre del conductor">
                                </div>
                        </div>
                        <button type="submit" class="btn-primary">Guardar Registro</button>
                    </form>
                </div>
                <div class="card">
                    <label for="productos">Productos</label>
                    <select>
                        <option value="pantalon">Pantalon</option>
                        <option value="campera">Campera</option>
                        <option value="remera">Remera</option>
                        <option value="buzo">Buzo</option>
                    </select>
                    <div class="add-product-row">
                        <input type="number">
                        <button type="button" class="btn-secondary">Agregar</button>
                    </div>
                
                    <table>                        
                        <thead>
                            <tr>
                                <th>Productos</th>
                                <th>Cantidad</th>
                                <th>Peso</th>
                                <th>SubTotal</th>
                                <th>Quitar</th>
                            </tr>
                        </thead>
                        <tbody id="productos-body">
                            <tr>
                                <td>Caja Estándar A</td>
                                <td>2</td>
                                <td>45Kg</td>
                                <td>$1000</td>
                                <td><button type="button" class="btn-delete">X</button></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>

            <aside>
                <h2>Resumen de Carga</h2>
                <p class="peso-total">450 kg / 1000 kg</p>
                    <div class="progress-bar">
                        <div class="progress-fill"></div>
                    </div>
                   <button type="submit" form="carga-form" class="btn-primary">Confirmar y Despachar</button>
            </aside>
        </div>

        <footer>
            Grupo 5 Web &copy; 2026
        </footer>
    </div>
</body>
</html>
