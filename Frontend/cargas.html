<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Seguimiento Logístico</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="container">
        <header>
            <h1>Sistema de Seguimiento de Logística y Distribución</h1>
        </header>

        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="gestion.html">Gestion</a></li>
                <li><a href="cargas.html" class="activo">Cargar</a></li>
                <li><a href="seguimiento.html">Seguimiento</a></li>
            </ul>
        </nav>

        <div class="main-wrapper">
                <div class="card" id="formulario">
                    <h2>Cargar Producto</h2>
                    <form class="product-form">
                        <div class="form-group">
                            <label for="nombre">Nombre del producto</label>
                            <input type="text" id="nombre" placeholder="Ej. Caja Reforzada" required>
                        </div>

                        <div class="form-group">
                            <label for="stock">Stock disponible</label>
                            <input type="number" id="stock" min="0" placeholder="0" required>
                        </div>

                        <div class="form-group">
                            <label for="estado">Estado actual</label>
                            <select id="estado">
                                <option value="pendiente">Pendiente</option>
                                <option value="preparado">Preparado</option>
                                <option value="entregado">Entregado</option>
                            </select>
                        </div>

                        <button type="submit" class="btn-primary">Guardar Registro</button>
                    </form>
                </div>
            </section>

            <aside>
                <h2>Buscador</h2>
                <form class="search-form">
                    <input type="text" placeholder="Buscar por ID o nombre...">
                    <button type="submit" class="btn-secondary">Buscar</button>
                </form>
            </aside>
        </div>

        <footer>
            Grupo 5 Web &copy; 2026
        </footer>
    </div>
</body>
</html>
