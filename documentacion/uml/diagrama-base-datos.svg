<rect x="60" y="1380" width="1800" height="120" rx="10" fill="#e9eef6"/>
<text x="80" y="1411" font-size="19" font-weight="600">PK: primaria · FK: foránea · UQ: única · ?: admite NULL · Varios PK en una tabla = clave compuesta</text>
<text x="80" y="1443" font-size="19">1: exactamente uno · 0..1: opcional, máximo uno · 0..*: cero o muchos · Las líneas representan claves foráneas.</text>
<text x="80" y="1475" font-size="19">Vehículo: muchos pedidos históricos; máximo un pedido activo (Confirmado o Despachado) por índice único parcial.</text>
<text x="60" y="1526" class="small">Fuente: Backend/schema.sql + Backend/persistencia.py · inicializaciones se crea al cargar datos base · Reservas y entregas no tienen tabla propia.</text>
